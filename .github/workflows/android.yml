name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ./
      - run: npx cap sync android
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.FINPING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/finping.jks"
            echo "FINPING_KEYSTORE=$RUNNER_TEMP/finping.jks" >> "$GITHUB_ENV"
            echo "FINPING_KEYSTORE_PASSWORD=${{ secrets.FINPING_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "FINPING_KEY_ALIAS=${{ secrets.FINPING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "FINPING_KEY_PASSWORD=${{ secrets.FINPING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing key secrets set: the release APK is signed with a temporary debug key."
          fi
      # A release build is not debuggable and carries no debug flags, which payment apps' security checks look at.
      - run: chmod +x gradlew && ./gradlew assembleRelease
        working-directory: android
      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinPing-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FinPing.apk
          SHA=$(git rev-parse --short HEAD)
          if [ "$BUILD_BRANCH" = "main" ]; then
            TAG=latest
            TITLE="FinPing (latest)"
            PRE=""
          else
            # Branch builds get their own pre-release so they never replace the main APK.
            TAG="apk-$(printf '%s' "$BUILD_BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
            TITLE="FinPing ($BUILD_BRANCH)"
            PRE="--prerelease"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" FinPing.apk $PRE --target "$(git rev-parse HEAD)" --title "$TITLE" --notes "Release APK built from branch '$BUILD_BRANCH' at $SHA. Enable 'Install unknown apps' to install."
